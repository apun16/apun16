name: Update streak stats

on:
  schedule:
    # Runs at both possible UTC offsets for ~6:45 PM America/New_York (EST/EDT).
    # generate-streak.mjs is idempotent and "Commit if changed" no-ops when
    # nothing changed, so running twice a day is harmless.
    - cron: "45 22 * * *" # 6:45 PM EDT (UTC-4)
    - cron: "45 23 * * *" # 6:45 PM EST (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: apun16
        run: node scripts/generate-streak.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update streak stats"
          git push
